name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: docker build -f deployment/worker.Dockerfile -t matrix-call-worker:0.1.0-alpha.1 .
      - run: pnpm verify:container

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PLAYWRIGHT_BROWSERS_PATH=.cache/browsers pnpm exec playwright-core install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm verify:media
      - run: pnpm build
      - run: docker build -f deployment/browser-worker.Dockerfile -t matrix-call-browser-worker:0.1.0-alpha.1 .
      - run: pnpm verify:browser-sandbox
      - run: pnpm verify:browser-container

  commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:matrix-commands

  marketplace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:marketplace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inspected-plugin-candidate
          path: |
            .cache/release/*.tgz
            .cache/release/SHA256SUMS
            .cache/release/release-report.json
          include-hidden-files: true
          if-no-files-found: error

  speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PLAYWRIGHT_BROWSERS_PATH=.cache/browsers pnpm exec playwright-core install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      - run: pnpm verify:speech-compose
      - run: pnpm release:images
      - run: pnpm verify:speech
      - run: MATRIX_CALL_SPEECH_TEST_MODEL=small pnpm verify:speech
      - run: pnpm verify:matrix-chat-media
      - run: pnpm verify:released-client
      - run: sha256sum --check SHA256SUMS
        working-directory: .cache/release-images
      - run: docker load --input .cache/release-images/matrix-call-images-0.1.0-alpha.1-linux-amd64.tar.gz
      - run: pnpm verify:released-client-image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inspected-worker-image-candidate
          path: |
            .cache/release-images/*.tar.gz
            .cache/release-images/SHA256SUMS
            .cache/release-images/release-report.json
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
